{% extends 'base.html' %}

{% block title %}Contacto - Bermellón Suites{% endblock %}

{% block content %}
    <h2>Contacto</h2>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <section class="panel form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Enviar mensaje</button>
        </form>
    </section>
{% endblock %}
