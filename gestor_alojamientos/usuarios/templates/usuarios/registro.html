{% extends 'base.html' %}

{% block title %}Registro - Bermellón Suites{% endblock %}

{% block content %}
    <h2>Registro de usuario</h2>

    <section class="panel form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Registrarme</button>
        </form>

        <p>
            <a href="{% url 'login' %}">Ya tengo usuario</a>
        </p>
    </section>
{% endblock %}
